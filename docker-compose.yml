version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: playra-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: playra
      POSTGRES_PASSWORD: playra
      POSTGRES_DB: playra
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playra"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio-storage
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do echo 'aguardando minio...' && sleep 1; done;
      mc mb -p local/playra-bucket;
      exit 0;
      "

volumes:
  minio-data:
  postgres-data: